services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: neosys_pharma
      POSTGRES_USER: neosys
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neosys -d neosys_pharma"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - neosys_postgres_data:/var/lib/postgresql/data

volumes:
  neosys_postgres_data:

